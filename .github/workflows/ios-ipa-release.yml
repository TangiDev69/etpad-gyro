name: Build ETPad iOS IPA

on:
  push:
    branches:
      - iphone-gyro-custom-resolution-download-tuning
    paths:
      - 'apple/ios/**'
      - 'apple/shared/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'libs'
      - '.github/workflows/ios-ipa-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etpad-ios-release
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-26-intel
    timeout-minutes: 180
    env:
      # The native dependency graph is memory-heavy. Two concurrent compiler
      # jobs are substantially safer on hosted macOS runners than CPU-count/2.
      ETPAD_BUILD_JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      SWIFTPM_MAX_CONCURRENT_OPERATIONS: '2'
    steps:
      - name: Checkout (including pinned libraries)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          submodules: recursive
          fetch-depth: 1

      - name: Restore native build cache
        uses: actions/cache@v4
        with:
          path: |
            build/ios-engine-device
            build/gl4es
            build/omnibot-ios
            build/sources/gl4es
            build/sources/omni-bot
            build/sources/boost_1_85_0
            build/boost_1_85_0.tar.bz2
            build/dependencies/angle-prebuilt
          key: ${{ runner.os }}-etpad-ios-v2-${{ github.ref_name }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'scripts/**', 'libs/**', 'apple/ios/**', 'apple/shared/**') }}
          restore-keys: |
            ${{ runner.os }}-etpad-ios-v2-${{ github.ref_name }}-

      - name: Inspect runner resources
        run: |
          echo "Runner: $(uname -a)"
          echo "CPU count: $(sysctl -n hw.ncpu)"
          echo "Physical memory: $(sysctl -n hw.memsize)"
          df -h .
          xcodebuild -version
          cmake --version || true

      - name: Install build tools
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja xcodegen

      - name: Prepare build log directory
        run: mkdir -p build/output

      - name: Build unsigned iOS IPA
        shell: bash
        run: |
          set -o pipefail
          ./scripts/build-etpad.sh --platform device --output build/output --ipa build/output/ETPad-iOS-unsigned.ipa 2>&1 | tee build/output/build.log

      - name: Verify IPA and calculate SHA-256
        run: |
          test -s build/output/ETPad-iOS-unsigned.ipa
          unzip -t build/output/ETPad-iOS-unsigned.ipa
          shasum -a 256 build/output/ETPad-iOS-unsigned.ipa > build/output/SHA256SUMS.txt
          cat build/output/SHA256SUMS.txt

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ETPad-iOS-build-diagnostics
          path: |
            build/output/build.log
            build/ios-engine-device/CMakeCache.txt
            build/omnibot-ios/device/bot/CMakeCache.txt
            build/gl4es/device/apple-build/CMakeCache.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ETPad-iOS-unsigned-IPA
          path: |
            build/output/ETPad-iOS-unsigned.ipa
            build/output/SHA256SUMS.txt
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: etpad-ios-build-${{ github.run_number }}
          name: ETPad iOS — Custom Gyro Build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: |
            build/output/ETPad-iOS-unsigned.ipa
            build/output/SHA256SUMS.txt
          body: |
            Experimental, unsigned iOS build of ETPad from the gyro/custom-resolution branch.

            Included: gyro aim and independent inversion, custom resolution, increased touch look sensitivity, improved FPS overlay, and download configuration changes.

            This IPA is **unsigned** and must be installed using a sideloading/signing tool. No original Wolfenstein: Enemy Territory game data is bundled; download/import your data in the app.
