// ETPad defaults for SDL GameController (Xbox, PlayStation, MFi).
// SPDX-License-Identifier: GPL-3.0-or-later
// Sticks are read directly as analog axes; RB opens the native quick-chat wheel.
set in_joystick 1
set in_joystickUseAnalog 1
set in_joystickThreshold 0.18
set etpad_controller 1
set j_yaw -0.007
set j_pitch 0.0055
set j_forward -0.00388
set j_side 0.00388
bind PAD0_RIGHTTRIGGER "+attack"
bind PAD0_LEFTTRIGGER "weapalt"
bind PAD0_A "+moveup"
bind PAD0_B "+movedown"
bind PAD0_X "+reload"
bind PAD0_Y "weaponbank 4"
bind PAD0_LEFTSHOULDER "+activate"
unbind PAD0_RIGHTSHOULDER
bind PAD0_LEFTSTICK_CLICK "+sprint"
bind PAD0_RIGHTSTICK_CLICK "+prone"
bind PAD0_BACK "+scores"
bind PAD0_START "togglemenu"
// D-pad: right cycles every weapon, left swaps back to the last one,
// up and down pick class gear (syringe/pliers/smoke, health/ammo/dynamite).
bind PAD0_DPAD_RIGHT "weapnext"
bind PAD0_DPAD_LEFT "weaplastused"
bind PAD0_DPAD_UP "weaponbank 5"
bind PAD0_DPAD_DOWN "weaponbank 6"
// Former hold-LB / hold-RB layers.
unbind AUX1
unbind AUX2
unbind AUX3
unbind AUX4
unbind AUX5
unbind AUX7
unbind AUX8
unbind AUX9
unbind AUX12
unbind AUX13
unbind AUX14
unbind AUX15
unbind JOY1
unbind JOY2
unbind JOY3
unbind JOY4
unbind JOY5
unbind JOY7
unbind JOY8
unbind JOY9
unbind JOY12
unbind JOY13
unbind JOY14
unbind JOY15
