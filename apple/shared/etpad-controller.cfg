// ETPad defaults for SDL GameController (Xbox, PlayStation, MFi).
// SPDX-License-Identifier: GPL-3.0-or-later
set in_joystick 1
set in_joystickUseAnalog 1
set in_joystickThreshold 0.18
set etpad_controller 1
set j_yaw -0.006
set j_pitch 0.005
set j_forward -0.00388
set j_side 0.00388
bind PAD0_LEFTSTICK_UP "+forward"
bind PAD0_LEFTSTICK_DOWN "+back"
bind PAD0_LEFTSTICK_LEFT "+moveleft"
bind PAD0_LEFTSTICK_RIGHT "+moveright"
bind PAD0_RIGHTSTICK_LEFT "+left"
bind PAD0_RIGHTSTICK_RIGHT "+right"
bind PAD0_RIGHTSTICK_UP "+lookup"
bind PAD0_RIGHTSTICK_DOWN "+lookdown"
bind PAD0_RIGHTTRIGGER "+attack"
bind PAD0_LEFTTRIGGER "weapalt"
bind PAD0_A "+moveup"
bind PAD0_B "+movedown"
bind PAD0_X "+reload"
bind PAD0_Y "+activate"
bind PAD0_BACK "+scores"
bind PAD0_START "togglemenu"
bind PAD0_LEFTSTICK_CLICK "+sprint"
bind PAD0_RIGHTSTICK_CLICK "+prone"
bind PAD0_DPAD_UP "+mapexpand"
bind PAD0_DPAD_DOWN "openlimbomenu"
bind PAD0_DPAD_LEFT "weapprev"
bind PAD0_DPAD_RIGHT "weapnext"
// Hold LB: lean, votes, console, team menu and directional quick chat.
bind AUX1 "+leanleft"
bind AUX2 "+leanright"
bind AUX3 "vote yes"
bind AUX4 "vote no"
bind AUX5 "toggleconsole"
bind AUX7 "teammenu"
bind AUX8 "classmenu"
bind AUX9 "openlimbomenu"
bind AUX12 "vsay_team Medic"
bind AUX13 "vsay_team NeedAmmo"
bind AUX14 "vsay_team Thanks"
bind AUX15 "vsay_team Affirmative"
// Hold RB: direct weapon slots. SDL button positions remain family-independent.
bind JOY1 "weaponbank 5"
bind JOY2 "weaponbank 6"
bind JOY3 "weaponbank 7"
bind JOY4 "weaponbank 8"
bind JOY5 "weaponbank 9"
bind JOY7 "weaponbank 10"
bind JOY8 "weaponbank 1"
bind JOY9 "weaponbank 2"
bind JOY12 "weaponbank 3"
bind JOY13 "weaponbank 4"
bind JOY14 "weapprev"
bind JOY15 "weapnext"
